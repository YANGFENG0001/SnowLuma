# 构建并发布「带自定义改动」的 SnowLuma 镜像到 GHCR。
#
# 与上游的关系：
#   上游 SnowLuma/SnowLuma 不含 Dockerfile（镜像由另一个仓库发布），所以本工作流
#   采取「基于官方镜像覆盖 /app/runtime」的策略，见仓库根的 Dockerfile 注释。
#
# 只构建 linux/amd64：Linux QQ 官方只有 x64 版本，构建 arm64 没有意义。
#
# 前置条件：
#   · 仓库 Settings → Actions → General → Workflow permissions 选
#     「Read and write permissions」（否则 GITHUB_TOKEN 推不了包）
#   · Packages 页面把 snowluma 包设为 Public，或在使用端 docker login ghcr.io
name: docker-image

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  # 上游同步工作流推完 main 后跟着跑一次，缩短「改动落地 → 镜像可拉」的窗口
  workflow_run:
    workflows: [sync-upstream]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_image:
        description: '基础镜像（默认官方 latest）'
        required: false
        default: 'motricseven7/snowluma:latest'

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # workflow_run 触发时只在同步成功的情况下继续
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime bundle
        run: pnpm build:all

      - name: Verify release layout
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-release-layout.mjs dist
          # 镜像里 /app/runtime 的根 chunk 与 client/ 都会被我们整体替换，
          # 少任何一个都会让镜像不可用（WebUI 直接 404），所以在这里挡一道。
          for required in dist/index.mjs dist/client/index.html; do
            if [ ! -f "${required}" ]; then
              echo "::error::缺少 ${required} —— 构建产物不完整，拒绝发布"
              exit 1
            fi
          done
          echo "✅ 产物完整：index.mjs + client/ 均在"

      - name: Verify our overrides are present in the bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -rq 'SNOWLUMA_ONEBOT_TOKEN' dist/; then
            echo "✅ dist/ 里已包含 SNOWLUMA_ONEBOT_TOKEN 覆盖逻辑"
          else
            echo "::error::dist/ 中未找到 SNOWLUMA_ONEBOT_TOKEN —— 打包没带上改动，拒绝发布"
            exit 1
          fi

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'motricseven7/snowluma:latest' }}
            SNOWLUMA_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### SnowLuma 镜像已发布"
            echo ""
            echo '```text'
            echo "${{ steps.image.outputs.name }}:latest"
            echo "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
